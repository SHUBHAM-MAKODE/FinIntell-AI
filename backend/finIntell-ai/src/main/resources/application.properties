spring.application.name=finIntell-ai

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/FinIntell_AI
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=12345678909

#port
server.port=8082

#hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Essential if your database already has pre-existing tables before adding Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# CRITICAL DEV TRICK: Validate schema, but generate script files automatically
#spring.jpa.hibernate.ddl-auto=validate later remove as comment
spring.jpa.properties.hibernate.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.hibernate.javax.persistence.schema-generation.scripts.create-target=src/main/resources/generated-schema.sql